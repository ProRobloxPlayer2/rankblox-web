<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rankblox Games</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10121b;
            color: white;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 6%;
            background: #191c2b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        nav a:hover { color: #8eabff; }

        .hero {
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 { font-size: clamp(2rem, 6vw, 3.5rem); }

        .hero p {
            color: #c5c8d8;
            font-size: 1.1rem;
        }

        .button {
            display: inline-block;
            padding: 13px 22px;
            margin: 10px 5px;
            background: #526dff;
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
        }

        .button.secondary { background: #30354c; }

        footer {
            text-align: center;
            padding: 25px;
            color: #a9aec3;
        }
    </style>
</head>

<body>
    <nav>
        <strong>🎮 Rankblox Games</strong>

        <div>
            <a href="index.html">Home</a>
            <a href="games.html">Play</a>
            <a href="account.html">Account</a>
        </div>
    </nav>

    <main class="hero">
        <h1>Welcome to Rankblox Games!</h1>
        <p>Play games, beat your high scores, and build your player profile.</p>

        <a class="button" href="games.html">🎮 Play Games</a>
        <a class="button secondary" href="account.html">👤 Sign Up / Log In</a>
    </main>

    <footer>
        Rankblox Games · Play, explore, and improve!
    </footer>
</body>
</html>
