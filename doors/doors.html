<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankblox Doors</title>

    <link rel="stylesheet" href="doors.css">
</head>

<body>

    <div id="game">

        <header>
            <h1>🚪 Rankblox Doors</h1>
        </header>

        <!-- ========================= -->
        <!-- MAIN GAME INFORMATION -->
        <!-- ========================= -->

        <section id="gameInfo">

            <p id="door">
                🚪 Door 1
            </p>

            <p id="health">
                ❤️ 100
            </p>

            <p id="status">
                🚪 Exploring...
            </p>

        </section>


        <!-- ========================= -->
        <!-- MAIN CONTROLS -->
        <!-- ========================= -->

        <section id="controls">

            <button id="openDoorBtn">
                🚪 Open Door
            </button>

            <button id="hideBtn">
                🗄️ Hide in Closet
            </button>

            <button id="crouchBtn" style="display:none;">
                🧎 Crouch
            </button>

        </section>


        <!-- ========================= -->
        <!-- LIBRARY -->
        <!-- ========================= -->

        <section id="libraryPanel" style="display:none;">

            <h2>📚 The Library</h2>

            <p id="libraryStatus">
                Find the books and collect their clues.
            </p>

            <div id="books"></div>

            <p id="clues">
                No clues collected yet.
            </p>

            <button id="bookBtn" style="display:none;">
                📖 Pick Up Book
            </button>

        </section>


        <!-- ========================= -->
        <!-- DOOR 50 LOCK -->
        <!-- ========================= -->

        <section id="libraryLockPanel" style="display:none;">

            <h2>🔐 Door 50 Lock</h2>

            <p>
                Arrange the symbols using the numbers
                shown in the clue list.
            </p>

            <p id="libraryTimer">
                ⏱️ Time: 70
            </p>

            <h3>Clues</h3>

            <div id="symbolList"></div>

            <h3>Lock</h3>

            <div id="lockNumbers"></div>

            <button id="unlockLibraryBtn">
                🔓 Unlock
            </button>

            <p id="libraryLockStatus"></p>

        </section>


        <!-- ========================= -->
        <!-- DOOR 100 ELEVATOR -->
        <!-- ========================= -->

        <section id="elevatorPanel" style="display:none;">

            <h2>🛗 Elevator Power</h2>

            <p id="elevatorInstruction">
                Restore the power.
            </p>

            <p id="elevatorPoints">
                Points: 15
            </p>

            <div id="switches"></div>

            <button id="confirmBtn">
                ✅ Confirm
            </button>

        </section>


    </div>


    <!-- ========================= -->
    <!-- GAME JAVASCRIPT -->
    <!-- ========================= -->

    <script src="doors.js"></script>

</body>

</html>
