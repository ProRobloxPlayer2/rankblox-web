<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankblox Doors</title>

    <!-- Doors CSS -->
    <link rel="stylesheet" href="doors.css">
</head>

<body>

    <div id="game">

        <h1>🚪 Rankblox Doors</h1>

        <div id="gameInfo">
            <p id="door">🚪 Door 1</p>
            <p id="health">❤️ 100</p>
            <p id="status">🚪 Ready...</p>
        </div>

        <!-- Main controls -->
        <div id="controls">
            <button id="openDoorBtn">🚪 Open Door</button>

            <button id="hideBtn">
                🗄️ Hide in Closet
            </button>

            <button id="crouchBtn" style="display: none;">
                🧎 Crouch
            </button>

            <button id="bookBtn" style="display: none;">
                📖 Pick Up Book
            </button>
        </div>
        <!-- DOOR 50 LIBRARY LOCK -->
<div id="libraryLockPanel" style="display: none;">

    <h2>🔐 Door 50 Lock</h2>

    <p id="libraryTimer">⏱️ Time: 70</p>

    <p>
        Use the symbol and number list to determine the correct order.
    </p>

    <div id="symbolList"></div>

    <h3>Lock</h3>

    <div id="lockNumbers"></div>

    <button id="unlockLibraryBtn">
        🔓 Unlock
    </button>

    <p id="libraryLockStatus"></p>

</div>
        <!-- Door 100 elevator -->
        <div id="elevatorPanel" style="display: none;">

            <h2>🛗 Elevator Power</h2>

            <p id="elevatorInstruction">
                Restore the power.
            </p>

            <div id="switches"></div>

            <button id="confirmBtn">
                ✅ Confirm
            </button>

        </div>

    </div>

    <!-- IMPORTANT:
         doors.js is in the SAME folder as doors.html -->
    <script src="doors.js"></script>

</body>
</html>
